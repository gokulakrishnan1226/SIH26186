<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real-Time Emotion Recognition Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(22, 30, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-happy: #10b981;
            --accent-sad: #3b82f6;
            --accent-angry: #ef4444;
            --accent-surprise: #f59e0b;
            --accent-fear: #8b5cf6;
            --accent-disgust: #ec4899;
            --accent-neutral: #64748b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            background: rgba(9, 13, 22, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .brand-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .brand-title h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-title p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        /* Main Layout */
        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* Glass Card Utility */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Video Feed Container */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .video-card {
            position: relative;
            aspect-ratio: 4 / 3;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        video {
            transform: scaleX(-1); /* Mirror view */
        }

        canvas#overlayCanvas {
            transform: scaleX(-1); /* Mirror canvas overlay to match video */
            pointer-events: none;
            z-index: 10;
        }

        .camera-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            z-index: 5;
        }

        .camera-placeholder svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
        }

        .btn-stop:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
        }

        /* Analytics Dashboard Sidebar */
        .analytics-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .hero-emotion-card {
            text-align: center;
            padding: 1.75rem;
            position: relative;
            overflow: hidden;
        }

        .hero-emotion-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6366f1, #a855f7, #10b981);
        }

        .hero-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .hero-emotion {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
            transition: color 0.3s ease;
        }

        .hero-confidence {
            font-size: 1rem;
            color: var(--accent-happy);
            font-weight: 600;
        }

        /* Emotion Bars Breakdown */
        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .emotion-bars {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .emotion-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .emotion-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            font-weight: 500;
        }

        .emotion-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .emotion-emoji {
            font-size: 1.1rem;
        }

        .bar-bg {
            height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.25s ease-out, background 0.3s ease;
        }

        /* Emotion-specific bar colors */
        .bar-fill[data-emotion="Happy"] { background: linear-gradient(90deg, #059669, #10b981); }
        .bar-fill[data-emotion="Sad"] { background: linear-gradient(90deg, #2563eb, #3b82f6); }
        .bar-fill[data-emotion="Angry"] { background: linear-gradient(90deg, #dc2626, #ef4444); }
        .bar-fill[data-emotion="Surprise"] { background: linear-gradient(90deg, #d97706, #f59e0b); }
        .bar-fill[data-emotion="Fear"] { background: linear-gradient(90deg, #7c3aed, #8b5cf6); }
        .bar-fill[data-emotion="Disgust"] { background: linear-gradient(90deg, #db2777, #ec4899); }
        .bar-fill[data-emotion="Neutral"] { background: linear-gradient(90deg, #475569, #64748b); }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--card-border);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm-3.5-9a1.5 1.5 0 1 0-1.5-1.5A1.5 1.5 0 0 0 8.5 11zm7 0a1.5 1.5 0 1 0-1.5-1.5 1.5 1.5 0 0 0 1.5 1.5zm-7 4a5 5 0 0 0 7 0"/></svg>
            </div>
            <div class="brand-title">
                <h1>AI Emotion Vision</h1>
                <p>Real-Time Facial Expression Analyzer</p>
            </div>
        </div>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Camera Off</span>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Video Feed -->
        <section class="video-section">
            <div class="glass-card video-card">
                <div class="camera-placeholder" id="placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    <p>Click "Start Camera" to launch live detection</p>
                </div>
                <video id="webcam" autoplay playsinline muted hidden></video>
                <canvas id="overlayCanvas"></canvas>
            </div>
            <div class="controls-bar">
                <button class="btn" id="startBtn" onclick="toggleCamera()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                    Start Camera
                </button>
            </div>
        </section>

        <!-- Sidebar Analytics -->
        <section class="analytics-section">
            <!-- Hero Emotion Display -->
            <div class="glass-card hero-emotion-card">
                <div class="hero-title">Detected Expression</div>
                <div class="hero-emotion" id="heroEmotion">Waiting...</div>
                <div class="hero-confidence" id="heroConfidence">Confidence: --%</div>
            </div>

            <!-- Probability Breakdown -->
            <div class="glass-card">
                <div class="chart-title">
                    <span>Emotion Spectrum</span>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">7 Classes</span>
                </div>
                <div class="emotion-bars" id="emotionBars">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        AI Facial Emotion Recognition &bull; Powered by TensorFlow & OpenCV
    </footer>

    <!-- Script -->
    <script>
        const EMOTIONS = [
            { name: 'Angry', emoji: '🤬' },
            { name: 'Disgust', emoji: '🤢' },
            { name: 'Fear', emoji: '😨' },
            { name: 'Happy', emoji: '😊' },
            { name: 'Sad', emoji: '😢' },
            { name: 'Surprise', emoji: '😲' },
            { name: 'Neutral', emoji: '😐' }
        ];

        let isStreaming = false;
        let videoStream = null;
        let predictInterval = null;

        const video = document.getElementById('webcam');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const ctx = overlayCanvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const placeholder = document.getElementById('placeholder');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const heroEmotion = document.getElementById('heroEmotion');
        const heroConfidence = document.getElementById('heroConfidence');
        const emotionBarsContainer = document.getElementById('emotionBars');

        // Render Initial Bar Chart Structure
        function initBars() {
            emotionBarsContainer.innerHTML = '';
            EMOTIONS.forEach(item => {
                const row = document.createElement('div');
                row.className = 'emotion-row';
                row.innerHTML = `
                    <div class="emotion-info">
                        <span class="emotion-name"><span class="emotion-emoji">${item.emoji}</span> ${item.name}</span>
                        <span class="emotion-pct" id="pct-${item.name}">0.0%</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" id="bar-${item.name}" data-emotion="${item.name}"></div>
                    </div>
                `;
                emotionBarsContainer.appendChild(row);
            });
        }
        initBars();

        async function toggleCamera() {
            if (isStreaming) {
                stopCamera();
            } else {
                await startCamera();
            }
        }

        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
                    audio: false
                });

                video.srcObject = videoStream;
                video.hidden = false;
                placeholder.style.display = 'none';

                video.onloadedmetadata = () => {
                    overlayCanvas.width = video.videoWidth;
                    overlayCanvas.height = video.videoHeight;
                };

                isStreaming = true;
                startBtn.classList.add('btn-stop');
                startBtn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
                    Stop Camera
                `;
                statusDot.classList.add('active');
                statusText.innerText = 'Live Feed';

                // Send frame to Flask backend every 120ms
                predictInterval = setInterval(captureAndPredict, 120);

            } catch (err) {
                alert("Could not access camera: " + err.message);
                console.error(err);
            }
        }

        function stopCamera() {
            if (predictInterval) clearInterval(predictInterval);
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            video.hidden = true;
            placeholder.style.display = 'flex';
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            isStreaming = false;
            startBtn.classList.remove('btn-stop');
            startBtn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                Start Camera
            `;
            statusDot.classList.remove('active');
            statusText.innerText = 'Camera Off';

            heroEmotion.innerText = 'Waiting...';
            heroConfidence.innerText = 'Confidence: --%';
            EMOTIONS.forEach(item => {
                document.getElementById(`bar-${item.name}`).style.width = '0%';
                document.getElementById(`pct-${item.name}`).innerText = '0.0%';
            });
        }

        async function captureAndPredict() {
            if (!isStreaming || video.paused || video.ended) return;

            // Capture frame into hidden canvas
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || 640;
            tempCanvas.height = video.videoHeight || 480;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.8);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                });

                const result = await response.json();
                if (result.status === 'success') {
                    drawOverlay(result.faces, tempCanvas.width, tempCanvas.height);
                }
            } catch (err) {
                console.error("Prediction error:", err);
            }
        }

        function drawOverlay(faces, width, height) {
            if (overlayCanvas.width !== width || overlayCanvas.height !== height) {
                overlayCanvas.width = width;
                overlayCanvas.height = height;
            }

            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            if (!faces || faces.length === 0) {
                heroEmotion.innerText = 'No Face Detected';
                heroConfidence.innerText = 'Confidence: --%';
                EMOTIONS.forEach(item => {
                    document.getElementById(`bar-${item.name}`).style.width = '0%';
                    document.getElementById(`pct-${item.name}`).innerText = '0.0%';
                });
                return;
            }

            // Primary face (first detected)
            const primaryFace = faces[0];
            heroEmotion.innerText = `${EMOTIONS.find(e => e.name === primaryFace.top_emotion).emoji} ${primaryFace.top_emotion}`;
            heroConfidence.innerText = `Confidence: ${primaryFace.confidence}%`;

            // Update Emotion Bars
            for (const [emotion, pct] of Object.entries(primaryFace.probabilities)) {
                const bar = document.getElementById(`bar-${emotion}`);
                const pctLabel = document.getElementById(`pct-${emotion}`);
                if (bar && pctLabel) {
                    bar.style.width = `${pct.toFixed(1)}%`;
                    pctLabel.innerText = `${pct.toFixed(1)}%`;
                }
            }

            // Draw bounding boxes on Canvas
            faces.forEach(face => {
                const [x, y, w, h] = face.bbox;

                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, w, h);

                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 16px Outfit, sans-serif';
                const text = `${face.top_emotion} (${face.confidence}%)`;
                const textWidth = ctx.measureText(text).width;

                ctx.fillRect(x, y - 28, textWidth + 16, 28);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(text, x + 8, y - 8);
            });
        }
    </script>
</body>
</html>
